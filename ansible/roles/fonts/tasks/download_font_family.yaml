---

- name: Font Info
  set_fact:
    family: "{{item|split(':')|first}}"
    source: "{{item|split(':')|last}}"

- name: Check font installation
  ansible.builtin.stat:
    path: "{{font_base_directory}}/{{source}}/{{family}}/.installed"
  register: font_install_marker

- name: Print font paths for debugging
  debug:
    msg:
      - "font_base_directory: {{ font_base_directory }}"
      - "source: {{ source }}"
      - "family: {{ family }}"
      - "font_install_marker.stat.exists: {{ font_install_marker.stat.exists }}"
      - "full path: {{ font_base_directory }}/{{ source }}/{{ family }}"

- name: "Download {{family}} [from {{source}} fonts]"
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/scripts/download
      {{ item | quote }}
      {{ font_base_directory | quote }}
    executable: >-
      {{
        font_downloader_python
        | default(ansible_python_interpreter | default('/usr/bin/python3'))
      }}
  when: not font_install_marker.stat.exists
